<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northstar Procurement Intelligence</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f3f6fa; --panel:#ffffff; --panel2:#f5f8fb; --border:#dce5ee; --text:#172b3a; --muted:#607487;
    --accent:#087e8b; --accent-soft:#e3f4f3; --good:#18794e; --warn:#a15c07; --bad:#bd3b35; --info:#3b6fb6;
    --good-soft:#e2f3ea; --warn-soft:#fbf0dc; --bad-soft:#f9e4e2; --grid:#e8eef4; --shadow:rgba(27,50,69,.08);
    --side:#0f2233; --side-text:#c8d6e2; --side-active:#16384f;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg:#0e1822; --panel:#16232f; --panel2:#1d2d3b; --border:#2b3f50; --text:#e6eef5; --muted:#a2b2c0;
    --accent:#55c4c4; --accent-soft:#1f3b43; --good:#57c58a; --warn:#e8b454; --bad:#f07870; --info:#7fa8e0;
    --good-soft:#1c3a2b; --warn-soft:#3b3015; --bad-soft:#412120; --grid:#263746; --shadow:rgba(0,0,0,.25);
    --side:#0a131c; --side-text:#b7c6d3; --side-active:#173246;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  button { font:inherit; cursor:pointer; }
  .shell { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
  aside { background:var(--side); color:var(--side-text); padding:16px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand { padding:0 20px 14px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:10px; }
  .brand b { display:block; color:#fff; font-size:17px; letter-spacing:.04em; }
  .brand span { font-size:11px; opacity:.7; }
  .nav-group { padding:10px 20px 4px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.55; }
  .nav a { display:block; padding:7px 20px; color:var(--side-text); font-size:13.5px; border-left:3px solid transparent; }
  .nav a:hover { background:rgba(255,255,255,.05); text-decoration:none; }
  .nav a.active { background:var(--side-active); color:#fff; border-left-color:var(--accent); }
  main { min-width:0; }
  .topbar { display:flex; align-items:center; gap:12px; padding:10px 24px; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  .search { flex:1; min-width:180px; max-width:420px; position:relative; }
  .search input { width:100%; padding:7px 12px; border:1px solid var(--border); border-radius:8px; background:var(--panel2); color:var(--text); }
  .results { position:absolute; top:38px; left:0; right:0; background:var(--panel); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px var(--shadow); max-height:340px; overflow:auto; z-index:20; }
  .results a { display:block; padding:8px 12px; color:var(--text); border-bottom:1px solid var(--grid); font-size:13px; }
  .results a small { color:var(--muted); margin-left:6px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font-size:12px; border:1px solid var(--border); background:var(--panel2); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--good); } .dot.snap { background:var(--warn); }
  .btn { padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.danger { color:var(--bad); }
  .content { padding:22px 24px 60px; max-width:1280px; }
  h1 { font-size:22px; margin-bottom:4px; } h2 { font-size:15px; margin:0 0 10px; } h3 { font-size:13px; margin-bottom:6px; color:var(--muted); font-weight:600; }
  .sub { color:var(--muted); margin-bottom:16px; }
  .banner { padding:10px 14px; border-radius:8px; border:1px solid var(--warn); background:var(--warn-soft); margin-bottom:14px; font-size:13px; }
  .banner.info { border-color:var(--info); background:var(--panel2); }
  .grid { display:grid; gap:14px; } .g2 { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); } .g3 { grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .g4 { grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; box-shadow:0 1px 2px var(--shadow); min-width:0; }
  .kpi .v { font-size:26px; font-weight:650; line-height:1.15; } .kpi .l { color:var(--muted); font-size:12px; }
  .kpi .n { font-size:11.5px; color:var(--muted); margin-top:4px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); }
  td { padding:7px 8px; border-bottom:1px solid var(--grid); }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--panel2); }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11.5px; font-weight:600; }
  .t-crit,.t-bad { background:var(--bad-soft); color:var(--bad); } .t-high,.t-warn { background:var(--warn-soft); color:var(--warn); }
  .t-elev { background:var(--accent-soft); color:var(--accent); } .t-std,.t-info { background:var(--panel2); color:var(--muted); } .t-good { background:var(--good-soft); color:var(--good); }
  .bar { height:9px; border-radius:5px; background:var(--grid); overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; } .sp { flex:1; }
  .scroll { max-height:520px; overflow:auto; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .crumb { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .tl { position:relative; margin:6px 0 0 8px; padding-left:18px; border-left:2px solid var(--border); }
  .tl div { position:relative; padding:4px 0; font-size:13px; } .tl div::before { content:""; position:absolute; left:-25px; top:10px; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--panel); }
  .tl div.slow::before { background:var(--bad); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal { background:var(--panel); border-radius:12px; max-width:560px; width:100%; padding:20px; max-height:90vh; overflow:auto; border:1px solid var(--border); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input[type=number], select, input[type=text] { padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--panel2); color:var(--text); width:100%; }
  svg text { fill:var(--muted); font-size:11px; } svg .axis { stroke:var(--border); } svg .grid { stroke:var(--grid); }
  .legend { font-size:12px; color:var(--muted); margin-top:6px; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  @media (max-width: 860px) { .shell { grid-template-columns:1fr; } aside { position:static; height:auto; } .content { padding:16px; } }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><b>NORTHSTAR</b><span>Procurement Intelligence</span></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <div class="search"><input id="search" type="text" placeholder="Search POs, suppliers, pages…  (press / or Ctrl+K)" autocomplete="off"><div class="results" id="results" hidden></div></div>
      <a class="pill" href="#/alerts" id="alerts-pill">Alerts</a>
      <span class="pill" id="fresh"><span class="dot"></span><span id="fresh-text">Loading…</span></span>
      <button class="btn" id="theme">Dark</button>
    </div>
    <div class="content" id="view"><p class="muted">Loading…</p></div>
  </main>
</div>
<div id="modal-root"></div>

<script>
const P2_URL = 'https://operations-assistant.onrender.com/';
const NAV = [
  ['', [['overview','Overview']]],
  ['Operations', [['queue','Action Center'],['riskmap','Risk Map'],['suppliers','Suppliers'],['process','Process Mining']]],
  ['Finance', [['finance','AP Controls & Working Capital']]],
  ['Decisions', [['interventions','Intervention Center'],['investigate','Investigations']]],
  ['Governance', [['governance','AI Security & Attack Lab'],['audit','Audit Log']]],
  ['Platform', [['models','Model Health'],['data','Data Quality'],['lineage','Data Lineage'],['architecture','Architecture'],['evidence','Evidence & Limitations'],['alerts','Alerts']]],
  ['', [['classic','Classic dashboard ↗']]],
];
let D = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=0) => n == null ? '—' : Number(n).toLocaleString(undefined, {maximumFractionDigits:d, minimumFractionDigits:d});
const money = n => n == null ? '—' : (Math.abs(n) >= 1e6 ? '€' + fmt(n/1e6, 2) + 'M' : Math.abs(n) >= 1e3 ? '€' + fmt(n/1e3, 0) + 'K' : '€' + fmt(n));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const tierTag = l => `<span class="tag ${({CRITICAL:'t-crit',HIGH:'t-high',ELEVATED:'t-elev'})[l] || 't-std'}">${esc(l)}</span>`;

/* ── audit log (this browser only; honest label on the Audit page) ── */
function audit(action, detail) {
  const log = store.get('ns-audit', []);
  log.unshift({ at: new Date().toISOString(), action, detail });
  store.set('ns-audit', log.slice(0, 200));
}

/* ── Ask Northstar (P2) ── */
function askUrl(q) { return P2_URL + '?q=' + encodeURIComponent(q); }
function askButton(q, label = 'Ask Northstar', cls = 'btn primary') {
  return `<a class="${cls}" href="${askUrl(q)}" target="_blank" rel="noreferrer" onclick="audit('ask_p2', ${esc(JSON.stringify(JSON.stringify(q)))})" title="Opens the Procurement Intelligence Agent (P2) with this question prefilled">${esc(label)} ↗</a>`;
}

/* ── SVG helpers ── */
function lineChart(pts, key, {w=560, h=190, unit='%', color='var(--accent)'} = {}) {
  if (!pts.length) return '<p class="muted small">No data.</p>';
  const xs = pts.map((_, i) => i), ys = pts.map(p => p[key]);
  const lo = Math.min(...ys, 0), hi = Math.max(...ys) * 1.1 || 1, L = 40, B = 24, T = 8;
  const X = i => L + (w - L - 8) * (pts.length === 1 ? .5 : i / (pts.length - 1)), Y = v => T + (h - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line class="grid" x1="${L}" x2="${w - 8}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, hi < 10 ? 1 : 0)}${unit}</text>`; }
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i)},${Y(p[key])}`).join(' ');
  const labels = pts.map((p, i) => (i % Math.ceil(pts.length / 6) === 0) ? `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">${esc(p.month || p.label || i)}</text>` : '').join('');
  const dots = pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p[key])}" r="3" fill="${color}"><title>${esc(p.month || '')}: ${fmt(p[key], 1)}${unit}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${labels}</svg>`;
}
function barRows(rows, {max, fmtv = v => fmt(v, 1), color = 'var(--accent)'} = {}) {
  const m = max ?? Math.max(...rows.map(r => r.value), 1e-9);
  return rows.map(r => `<div style="margin:6px 0"><div class="row small"><span>${esc(r.label)}</span><span class="sp"></span><b>${esc(r.text ?? fmtv(r.value))}</b></div><div class="bar"><i style="width:${Math.max(2, 100 * Math.abs(r.value) / m)}%;background:${r.color || color}"></i></div></div>`).join('');
}
function scatter(pts, {xKey, yKey, xLabel, yLabel, w = 620, h = 340, logX = false, onClickFn, rKey, colorFn}) {
  if (!pts.length) return '<p class="muted small">No data.</p>';
  const L = 52, B = 36, T = 10, R = 12;
  const xv = pts.map(p => logX ? Math.log10(Math.max(p[xKey], 1)) : p[xKey]), yv = pts.map(p => p[yKey]);
  const x0 = Math.min(...xv), x1 = Math.max(...xv), y0 = Math.min(...yv), y1 = Math.max(...yv);
  const X = v => L + (w - L - R) * ((v - x0) / ((x1 - x0) || 1)), Y = v => T + (h - T - B) * (1 - (v - y0) / ((y1 - y0) || 1));
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  let out = `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img"><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${h - B}"/><line class="axis" x1="${L}" x2="${w - R}" y1="${h - B}" y2="${h - B}"/>`;
  out += `<line class="grid" x1="${X(mx)}" x2="${X(mx)}" y1="${T}" y2="${h - B}" stroke-dasharray="4 4"/><line class="grid" x1="${L}" x2="${w - R}" y1="${Y(my)}" y2="${Y(my)}" stroke-dasharray="4 4"/>`;
  out += `<text x="${(L + w) / 2}" y="${h - 6}" text-anchor="middle">${esc(xLabel)}</text><text x="12" y="${(T + h) / 2}" transform="rotate(-90 12 ${(T + h) / 2})" text-anchor="middle">${esc(yLabel)}</text>`;
  const rmax = rKey ? Math.max(...pts.map(p => p[rKey])) : 1;
  pts.forEach((p, i) => {
    const r = rKey ? 3 + 11 * Math.sqrt(p[rKey] / rmax) : 4;
    out += `<circle cx="${X(xv[i])}" cy="${Y(yv[i])}" r="${r}" fill="${colorFn(p)}" fill-opacity=".6" stroke="${colorFn(p)}" style="cursor:pointer" onclick="${onClickFn}(${esc(JSON.stringify(JSON.stringify(p.id)))})"><title>${esc(p.tip)}</title></circle>`;
  });
  return out + '</svg>';
}

/* ── views ── */
const V = {};

V.overview = () => {
  const k = D.kpis, t = D.trend, q = D.queue || [];
  const crit = q.filter(x => x.level === 'CRITICAL').length;
  const worst = (D.suppliers || [])[0];
  const stage = (D.where_time || [])[0];
  const brief = [
    `${fmt(k.cases)} closed purchase-order cases analysed across ${fmt(k.suppliers)} suppliers; average cycle time ${fmt(k.avg_cycle_days, 1)} days.`,
    k.high_risk != null ? `${fmt(k.high_risk)} cases are in the top decile of model risk scores, carrying ${money(k.high_risk_value)} of order value.` : 'Risk model unavailable.',
    stage ? `Largest single delay: <b>${esc(stage.stage)}</b> (${fmt(stage.pct_of_total_delay, 1)}% of total delay, median ${fmt(stage.median_hours, 0)}h).` : '',
    worst ? `Supplier with the most high-priority cases: <b>${esc(worst.supplier_id)}</b> (${worst.high_risk_cases} high-priority of ${worst.cases}).` : '',
  ].filter(Boolean).map(s => `<li>${s}</li>`).join('');
  return `
  <h1>Procurement Control Tower</h1>
  <p class="sub">Monitor → Investigate → Prioritise → Act → Measure. ${esc(D.replay_note)}</p>
  <div class="grid g4">
    <div class="card kpi"><div class="l">Cases analysed</div><div class="v">${fmt(k.cases)}</div><div class="n">${fmt(k.suppliers)} suppliers</div></div>
    <div class="card kpi"><div class="l">SLA breach rate (configured targets)</div><div class="v">${fmt(k.breach_rate, 1)}%</div><div class="n">${esc(k.sla_note || '')}</div></div>
    <div class="card kpi"><div class="l">High-priority cases</div><div class="v">${fmt(k.high_risk)}</div><div class="n">top decile of model score · ${crit} critical in queue</div></div>
    <div class="card kpi"><div class="l">Value in high-priority cases</div><div class="v">${money(k.high_risk_value)}</div><div class="n">max order net worth per case</div></div>
    <div class="card kpi"><div class="l">Average cycle time</div><div class="v">${fmt(k.avg_cycle_days, 1)} d</div><div class="n">${esc(k.delta_note || '')}</div></div>
    <div class="card kpi"><div class="l">Interventions recorded</div><div class="v">0</div><div class="n">none recorded; ROI is simulated · <a href="#/interventions">Intervention Center</a></div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Executive brief <span class="tag t-info">auto-generated from the figures here, no LLM</span></h2><ul style="padding-left:18px">${brief}</ul>
      <div class="row" style="margin-top:12px">${askButton('Why do so many cases breach their SLA, and which stages and suppliers drive it?', 'Investigate in Ask Northstar')} <a class="btn" href="#/queue">Review Action Center</a></div></div>
    <div class="card"><h2>Risk funnel</h2>${funnel(D.funnel)}</div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Breach rate by completion month</h2>${lineChart(t, 'breach_rate')}<div class="legend">Months with ≥30 completed cases. Late months are right-censored (only slow cases finish late), so read the shape, not the last point.</div></div>
    <div class="card"><h2>Where the time goes</h2>${barRows((D.where_time || []).slice(0, 6).map(s => ({label: s.stage, value: s.pct_of_total_delay, text: fmt(s.pct_of_total_delay, 1) + '% · median ' + fmt(s.median_hours, 0) + 'h'})))}
      <div class="row small" style="margin-top:8px"><a href="#/process">Open process explorer →</a>${askButton('Which process stage causes the most delay and why?', 'Ask about bottlenecks', 'btn')}</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Risk × value</h2>${riskScatter(420, 260)}<div class="legend">Each dot is a case. Top-right = high model score and high order value. <a href="#/riskmap">Full map →</a></div></div>
    <div class="card"><h2>Action Center — top of the queue</h2>${queueTable((D.queue || []).slice(0, 6))}<div style="margin-top:8px"><a href="#/queue">All ${(D.queue || []).length} queued cases →</a></div></div>
  </div>
  <div class="grid g3" style="margin-top:14px">${controlHealthCard()}${confidenceCard()}${apTile()}</div>`;
};

function funnel(rows) {
  const m = rows[0].n || 1;
  return rows.map(r => `<div style="margin:8px 0"><div class="row small"><span>${esc(r.label)}</span><span class="sp"></span><b>${fmt(r.n)}</b></div><div class="bar"><i style="width:${Math.max(1.5, 100 * r.n / m)}%"></i></div>${r.note ? `<div class="small muted">${esc(r.note)}</div>` : ''}</div>`).join('');
}
function riskScatter(w, h) {
  const pts = (D.scatter || []).map(p => ({id: p.case_id, value: Math.max(p.value, 1), risk: p.risk, tip: `${p.case_id} · ${money(p.value)} · score ${p.risk}`}));
  const sorted = [...pts].sort((a, b) => a.risk - b.risk), n = sorted.length;
  const q90 = sorted[Math.floor(n * .9)]?.risk ?? 1;
  return scatter(pts, {xKey: 'value', yKey: 'risk', xLabel: 'Order value (log scale)', yLabel: 'Model risk score', w, h, logX: true, onClickFn: 'openPo',
    colorFn: p => p.risk >= q90 ? 'var(--bad)' : 'var(--accent)'});
}
function queueTable(rows) {
  if (!rows.length) return '<p class="muted">No scored cases (model unavailable).</p>';
  return `<table><thead><tr><th>Case</th><th>Supplier</th><th>Priority</th><th>Value</th><th>Main driver</th></tr></thead><tbody>${rows.map(r =>
    `<tr class="click" onclick="openPo(${esc(JSON.stringify(JSON.stringify(r.case_id)))})"><td>${esc(r.case_id)}</td><td>${esc(r.supplier_id)}</td><td>${tierTag(r.level)}</td><td>${money(r.value)}</td><td>${esc(r.top_reason || '—')}</td></tr>`).join('')}</tbody></table>`;
}
function controlHealthCard() {
  const c = D.finance.control_health || [];
  return `<div class="card"><h2>Control health</h2>${c.map(x => `<div class="row small" style="margin:4px 0"><span>${x.status === 'not_valid' ? '<span class="tag t-bad">not valid</span>' : '<span class="tag t-good">ok</span>'}</span><span>${esc(x.id.replace(/_/g, ' '))}</span><span class="sp"></span><span class="muted">${x.recall != null ? 'recall ' + fmt(100 * x.recall, 1) + '%' : ''}</span></div>`).join('')}<div class="small muted" style="margin-top:6px">Recall is against planted synthetic anomalies only. <a href="#/finance">Details →</a></div></div>`;
}
function confidenceCard() {
  return `<div class="card"><h2>Northstar confidence</h2>
    <div class="row small"><span class="tag t-good">good</span> Data lineage & tests</div>
    <div class="row small" style="margin-top:4px"><span class="tag t-good">good</span> Model validation (PO-isolated, held-out calibration)</div>
    <div class="row small" style="margin-top:4px"><span class="tag t-warn">partial</span> SLA coverage (${fmt(D.data_quality.explicit_sla_share_pct, 0)}% explicit)</div>
    <div class="row small" style="margin-top:4px"><span class="tag t-bad">none</span> Real intervention outcomes</div>
    <div class="small muted" style="margin-top:6px">Overall: <b>moderate</b>. Interventions are simulated. <a href="#/evidence">Evidence →</a></div></div>`;
}
function apTile() {
  const a = D.finance.ap;
  if (!a || !a.available) return `<div class="card"><h2>AP exceptions</h2><p class="muted small">${esc(a?.reason || 'unavailable')}</p></div>`;

function portfolio() {

  const vs = pts.map(p => p.value).sort((a, b) => a - b), rs = pts.map(p => p.risk).sort((a, b) => a - b);

V.process = () => {
  const m = (location.hash.match(/metric=(\w+)/) || [])[1] || 'median_hours';
  const {nodes, edges} = D.process;
  const labels = {median_hours: 'Median wait', p75_hours: 'P75 wait', p90_hours: 'P90 wait', breach_rate: 'Case breach rate'};
  const vals = edges.map(e => e[m] ?? 0), maxv = Math.max(...vals, 1e-9);
  const order = {}; // layer by earliest typical position: BFS from most common start
  const indeg = {}; edges.forEach(e => indeg[e.to] = (indeg[e.to] || 0) + 1);
  const start = nodes.map(n => n.id).filter(n => !indeg[n]);
  (start.length ? start : [nodes[0].id]).forEach(s => order[s] = 0);
  for (let it = 0; it < 12; it++) edges.forEach(e => { if (order[e.from] != null && (order[e.to] == null || order[e.to] < order[e.from] + 1) && order[e.from] + 1 < 9 && e.from !== e.to) order[e.to] = order[e.from] + 1; });
  nodes.forEach(n => { if (order[n.id] == null) order[n.id] = 0; });
  const layers = {}; nodes.forEach(n => (layers[order[n.id]] ||= []).push(n));
  const W = 1000, colW = W / (Object.keys(layers).length || 1), pos = {};
  Object.entries(layers).forEach(([l, ns]) => ns.forEach((n, i) => pos[n.id] = {x: 20 + l * colW, y: 24 + i * 50}));
  const H = Math.max(...Object.values(layers).map(a => a.length), 4) * 50 + 40;
  const col = v => v / maxv > .66 ? 'var(--bad)' : v / maxv > .33 ? 'var(--warn)' : 'var(--good)';
  let svg = `<svg viewBox="0 0 ${W + 120} ${H}" width="100%" role="img">`;
  edges.forEach((e, i) => { const a = pos[e.from], b = pos[e.to]; if (!a || !b || e.from === e.to) return; const v = e[m] ?? 0;
    svg += `<path d="M${a.x + 150},${a.y + 14} C${a.x + 190},${a.y + 14} ${b.x - 40},${b.y + 14} ${b.x},${b.y + 14}" fill="none" stroke="${col(v)}" stroke-opacity=".7" stroke-width="${1 + 6 * Math.sqrt(e.transitions / edges[0].transitions)}" style="cursor:pointer" onclick="showEdge(${i})"><title>${esc(e.from)} → ${esc(e.to)}: ${m === 'breach_rate' ? fmt(v, 1) + '%' : fmt(v, 0) + ' h'} (${e.transitions} transitions)</title></path>`; });
  nodes.forEach(n => { const p = pos[n.id]; svg += `<g><rect x="${p.x}" y="${p.y}" width="150" height="28" rx="6" fill="var(--panel2)" stroke="var(--border)"/><text x="${p.x + 6}" y="${p.y + 12}" style="fill:var(--text);font-size:10.5px">${esc(n.id.length > 24 ? n.id.slice(0, 23) + '…' : n.id)}</text><text x="${p.x + 6}" y="${p.y + 24}" style="font-size:9.5px">${fmt(n.events)} events</text></g>`; });
  svg += '</svg>';
  window.__edges = edges;
  return `<h1>Process Mining</h1><p class="sub">Directly-follows graph of the ${nodes.length} most frequent activities (${edges.length} most frequent transitions). Edge colour = ${labels[m].toLowerCase()}; thickness = frequency.</p>
  <div class="row" style="margin-bottom:10px">${Object.entries(labels).map(([k, l]) => `<a class="pill ${k === m ? 'active' : ''}" style="${k === m ? 'border-color:var(--accent)' : ''}" href="#/process?metric=${k}">${l}</a>`).join('')}<span class="sp"></span>${askButton('Which process transitions are the biggest bottlenecks and why?', 'Ask about bottlenecks')}</div>
  <div class="card" style="overflow:auto">${svg}</div><div class="card" id="edge-detail" style="margin-top:14px"><p class="muted small">Click an edge to see its details.</p></div>
  <div class="card" style="margin-top:14px"><h2>Largest stage delays</h2><table><thead><tr><th>Stage</th><th>Cases</th><th>Median</th><th>P90</th><th>% of total delay</th></tr></thead><tbody>${D.where_time.map(s => `<tr><td>${esc(s.stage)}</td><td>${s.case_count}</td><td>${fmt(s.median_hours, 0)} h</td><td>${fmt(s.p90_hours, 0)} h</td><td>${fmt(s.pct_of_total_delay, 1)}%</td></tr>`).join('')}</tbody></table></div>`;
};
function showEdge(i) { const e = window.__edges[i]; $('#edge-detail').innerHTML = `<h2>${esc(e.from)} → ${esc(e.to)}</h2><div class="grid g4"><div class="kpi"><div class="l">Transitions</div><div class="v">${fmt(e.transitions)}</div><div class="n">${fmt(e.cases)} cases</div></div><div class="kpi"><div class="l">Median / P75 / P90</div><div class="v">${fmt(e.median_hours, 0)} / ${fmt(e.p75_hours, 0)} / ${fmt(e.p90_hours, 0)} h</div></div><div class="kpi"><div class="l">Cases breaching SLA through this edge</div><div class="v">${e.breach_rate == null ? '—' : fmt(e.breach_rate, 1) + '%'}</div></div></div><div style="margin-top:8px">${askButton('Why is the transition from "' + e.from + '" to "' + e.to + '" slow, and what should we do?', 'Investigate this transition')}</div>`; }

/* ── interventions (demo workflow; the approval gate of record is P3) ── */
function proposeIntervention(id) {
  const p = D.po[id], cfg = D.intervention_config;
  if (!cfg.available) { alert('Intervention assumptions unavailable'); return; }
  const types = Object.keys(cfg.types);
  $('#modal-root').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h2>Intervention review — case ${esc(id)}</h2><span class="tag t-warn">SIMULATION — assumptions, not measured effects</span>
    <label>Intervention type</label><select id="iv-type" onchange="updateIv('${esc(id)}')">${types.map(t => `<option>${esc(t)}</option>`).join('')}</select>
    <div class="grid g2"><div><label>Cost per case (assumed)</label><input type="number" id="iv-cost"></div><div><label>Relative cut in breach probability (assumed)</label><input type="number" step="0.01" id="iv-eff"></div></div>
    <label>Value of one avoided breach (assumed)</label><input type="number" id="iv-bc" value="${cfg.breach_cost}">
    <div class="card" style="margin-top:12px" id="iv-out"></div>
    <p class="small muted" style="margin-top:8px">Evidence: model score ${fmt(p.risk, 3)} (${esc(p.level)}), order value ${money(p.value)}, top driver “${esc(p.shap[0]?.label || '')}”. Approval below is a <b>demo</b>: it is recorded in this browser's audit log only. In the full platform the gate of record is the P3 action firewall (policy → taint → human approval, requester cannot self-approve).</p>
    <div class="row" style="margin-top:12px"><button class="btn danger" onclick="decideIv('${esc(id)}','rejected')">Reject</button><span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="decideIv('${esc(id)}','approved')">Approve (demo)</button></div></div></div>`;
  updateIv(id);
  ['iv-cost', 'iv-eff', 'iv-bc'].forEach(i => $('#' + i).addEventListener('input', () => calcIv()));
}
function updateIv(id) { const cfg = D.intervention_config, t = cfg.types[$('#iv-type').value]; $('#iv-cost').value = t.cost; $('#iv-eff').value = t.effect; calcIv(); }
function calcIv() {
  const cost = +$('#iv-cost').value, eff = +$('#iv-eff').value, bc = +$('#iv-bc').value;
  // Breakeven: the effect (relative cut in breach probability) at which expected saving equals cost, given a breach
  // probability of 1 (the configured-SLA breach rate is ~95%, so this is the optimistic bound).
  const saving = eff * bc, net = saving - cost, be = cost / bc;
  $('#iv-out').innerHTML = `<div class="grid g3"><div class="kpi"><div class="l">Expected saving</div><div class="v">${money(saving)}</div></div><div class="kpi"><div class="l">Cost</div><div class="v">${money(cost)}</div></div><div class="kpi"><div class="l">Net (simulated)</div><div class="v" style="color:${net >= 0 ? 'var(--good)' : 'var(--bad)'}">${money(net)}</div></div></div><div class="small muted">Break-even effect: ${fmt(100 * be, 1)}% cut in breach probability (upper-bound: assumes the case would otherwise breach).</div>`;
}
function decideIv(id, status) {
  const list = store.get('ns-interventions', []);
  list.unshift({id, status, type: $('#iv-type').value, cost: +$('#iv-cost').value, effect: +$('#iv-eff').value, breach_cost: +$('#iv-bc').value, at: new Date().toISOString()});
  store.set('ns-interventions', list.slice(0, 100)); audit('intervention_' + status, `case ${id} (${$('#iv-type').value}) — demo, local only`);
  closeModal(); location.hash = '#/interventions';
}

function render() {
  if (!D) return;

  $('#view').innerHTML = (D.snapshot && D.snapshot.live === false ? `<div class="banner">Showing a saved snapshot from ${esc(D.snapshot.as_of || 'an earlier build')}${D.snapshot.reason ? ' — the live database is unavailable' : ''}. Numbers are real but not current.</div>` : '') + fn(arg);
  $('#nav').innerHTML = NAV.map(([g, items]) => (g ? `<div class="nav-group">${g}</div>` : '') + items.map(([k, l]) => k === 'classic' ? `<a href="/dashboard">${l}</a>` : `<a href="#/${k}" class="${k === name || (k === 'queue' && name === 'po') || (k === 'suppliers' && name === 'supplier') ? 'active' : ''}">${l}</a>`).join('')).join('');
  window.scrollTo(0, 0);
  if (name === 'governance') runLab();

function searchIndex() {
  const idx = [];
  NAV.forEach(([, items]) => items.forEach(([k, l]) => idx.push({t: l, s: 'page', h: '#/' + k})));
  Object.keys(D.po || {}).forEach(id => idx.push({t: id, s: 'case', h: '#/po/' + encodeURIComponent(id)}));
  (D.suppliers || []).forEach(r => idx.push({t: r.supplier_id, s: 'supplier', h: '#/supplier/' + encodeURIComponent(r.supplier_id)}));
  return idx;
}
function setupSearch() {
  const input = $('#search'), box = $('#results'), idx = searchIndex();
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { box.hidden = true; return; }
    const m = idx.filter(x => x.t.toLowerCase().includes(q)).slice(0, 12);
    box.innerHTML = m.map(x => `<a href="${x.h}" onclick="document.getElementById('results').hidden=true">${esc(x.t)}<small>${x.s}</small></a>`).join('') || '<a>No matches</a>';
    box.hidden = false;
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { const a = box.querySelector('a[href]'); if (a) { location.hash = a.getAttribute('href'); box.hidden = true; input.blur(); } } if (e.key === 'Escape') { box.hidden = true; input.blur(); } });
  document.addEventListener('keydown', e => { if ((e.key === '/' && document.activeElement.tagName !== 'INPUT') || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); input.focus(); input.select(); } });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) box.hidden = true; });
}
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark'; store.set('ns-theme', t); }
$('#theme').addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
setTheme(store.get('ns-theme', 'light'));

async function boot() {
  try {
    const res = await fetch('/app/data');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    D = await res.json();
    if (D.available === false) throw new Error(D.reason || 'unavailable');
  } catch (err) {
    $('#view').innerHTML = `<div class="banner">Could not load data: ${esc(err.message)}. The API may be waking from a free-tier sleep — retrying in 15 s.</div>`;
    setTimeout(boot, 15000); return;
  }
  const live = D.snapshot && D.snapshot.live !== false;
  $('#fresh').innerHTML = `<span class="dot ${live ? '' : 'snap'}"></span><span>${live ? 'LIVE' : 'SNAPSHOT ' + esc((D.snapshot.as_of || '').slice(0, 10))} · replay data</span>`;
  const n = computeAlerts().filter(a => a.sev !== 'info').length;
  $('#alerts-pill').textContent = n ? `Alerts · ${n}` : 'Alerts';
  setupSearch(); render();
}
window.addEventListener('hashchange', render);
boot();
</script>
