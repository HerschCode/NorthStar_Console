version: 2

updates:
  # Actions are pinned by commit SHA; Dependabot proposes the new SHA with its version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Provider and module version constraints, and the committed lock files.
  - package-ecosystem: terraform
    directories:
      - "/envs/*"
      - "/modules/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
