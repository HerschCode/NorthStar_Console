name: Console / CI
on:
  push:
    branches: [main]
    paths: ['apps/console/**', '.github/workflows/console-ci.yml']
  pull_request:
    branches: [main]
    paths: ['apps/console/**', '.github/workflows/console-ci.yml']
permissions: { contents: read }
defaults:
  run:
    working-directory: apps/console

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/console/package-lock.json }
      - run: npm ci
      - name: Generated API types match the pinned OpenAPI specs
        run: npm run gen:api && git diff --exit-code -- src/api/generated
      - name: Pinned OpenAPI specs match the service directories in this checkout
        run: node scripts/sync-specs.mjs --check --local
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install a browser for Playwright (CI has no Edge)
        run: npx playwright install --with-deps chromium
      - name: "End-to-end (recorded P1 data + mock gateway, the demo story, axe, phone width)"
        run: PW_CHANNEL=chromium npx playwright test --project=fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with: { name: playwright-traces, path: apps/console/test-results }
