name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generated API types match the pinned OpenAPI specs
        run: npm run gen:api && git diff --exit-code -- src/api/generated
      - name: Pinned OpenAPI specs match what P1, P2 and P3 publish on main
        run: node scripts/sync-specs.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install a browser for Playwright (CI has no Edge)
        run: npx playwright install --with-deps chromium
      - name: End-to-end (recorded P1 data + mock gateway: the demo story, axe, phone width)
        run: PW_CHANNEL=chromium npx playwright test --project=fixtures
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results }
