# Render Blueprint -- reproducible deploy, no dashboard clicking required.
# In the Render dashboard: New + -> Blueprint -> point at this repo. It reads this
# file and creates the service below, prompting for the `sync: false` secrets
# (never stored in this file/repo) at creation time.
#
# Free tier notes: 512MB RAM, spins down after ~15 min idle (first request after
# that takes ~30-60s to wake, and Neon's free-tier Postgres compute does the same --
# see docs/architecture.svg and PLAN.md for the real bugs that cold-start behavior
# surfaced and how they were fixed).
services:
  - type: web
    name: operations-performance
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false  # Neon (or any Postgres) connection details -- never committed
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: "require"  # Neon (and most hosted Postgres) rejects unencrypted connections
      - key: API_KEY
        sync: false  # generate a real secret -- see .env.example
      - key: API_ALLOWED_ORIGINS
        value: "https://operations-assistant.onrender.com"
